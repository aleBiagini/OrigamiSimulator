<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavoli Cerimonia - Alessandro e Simona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d5 100%);
            min-height: 100vh;
            color: #3d3429;
        }

        header {
            background: white;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: #8b7355;
            font-size: 24px;
            margin-bottom: 4px;
        }

        header p {
            color: #777;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 16px;
        }

        .toolbar input[type="search"] {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .toolbar input[type="search"]:focus {
            outline: none;
            border-color: #8b7355;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-primary { background: #8b7355; color: white; }
        .btn-primary:hover { background: #6d5a44; }
        .btn-secondary { background: #e8e0d5; color: #5a4a3a; }
        .btn-secondary:hover { background: #d8cfc0; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 24px;
        }

        .stat {
            background: white;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            font-size: 13px;
        }

        .stat strong {
            color: #8b7355;
            font-size: 20px;
            display: block;
        }

        main {
            padding: 0 24px 40px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .tables-stage {
            display: flex;
            gap: 32px;
            align-items: stretch;
            margin-bottom: 24px;
        }

        @media (max-width: 1100px) {
            .tables-stage {
                flex-direction: column;
                gap: 24px;
            }
        }

        .imperial-table {
            flex: 1;
            min-width: 0;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .table-panel-header {
            background: #8b7355;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .table-panel-header h2 {
            font-size: 16px;
            font-weight: normal;
        }

        .table-count {
            background: rgba(255,255,255,0.2);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .table-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 0;
            padding: 16px 12px;
            min-height: 400px;
        }

        .table-spine {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 36px;
            margin: 0 8px;
        }

        .table-surface {
            flex: 1;
            width: 100%;
            min-height: 120px;
            background: #d4c4b0;
            border: 1px solid #b8a890;
            border-radius: 4px;
        }

        .seat-column {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .seat-column.left .guest-chip {
            flex-direction: row-reverse;
            text-align: right;
        }

        .seat-column.left .guest-chip .num {
            text-align: left;
        }

        .seat-column.left .guest-chip .tags {
            justify-content: flex-end;
        }

        .seat-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 80px;
        }

        .seat-list.drag-over {
            background: rgba(139,115,85,0.06);
            border-radius: 6px;
            outline: 2px dashed #8b7355;
            outline-offset: 2px;
        }

        .guest-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            background: #f9f6f2;
            border: 1px solid #e6dfd3;
            border-radius: 4px;
            cursor: grab;
            font-size: 12px;
            line-height: 1.3;
            transition: box-shadow 0.15s;
            user-select: none;
        }

        .guest-chip:hover {
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
            border-color: #c9b99a;
        }

        .guest-chip.dragging {
            opacity: 0.45;
            cursor: grabbing;
        }

        .guest-chip.hidden-by-search {
            display: none;
        }

        .guest-chip .num {
            color: #ccc;
            font-size: 10px;
            min-width: 16px;
            flex-shrink: 0;
        }

        .guest-chip .name {
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .tags {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .tag-seggiolone { background: #fff3cd; color: #856404; }
        .tag-gruppo { background: #f8d7da; color: #721c24; }

        .pool-section {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 16px 20px;
        }

        .pool-section h3 {
            color: #8b7355;
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        .pool-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 48px;
        }

        .pool-list .guest-chip {
            flex: 0 0 auto;
        }

        .pool-list.drag-over,
        .pool-list:empty::after {
            content: 'Trascina qui gli invitati non assegnati';
            color: #bbb;
            font-style: italic;
            font-size: 13px;
            padding: 12px;
            width: 100%;
        }

        .pool-list:not(:empty).drag-over::after {
            display: none;
        }

        .empty-side {
            color: #ccc;
            font-style: italic;
            font-size: 12px;
            padding: 8px;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #2c3e50;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            z-index: 200;
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .sync-panel {
            background: #fff8e6;
            border: 1px solid #f0d78c;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .sync-panel.ok {
            background: #eef8f0;
            border-color: #b8dfc2;
        }

        .sync-panel h3 {
            color: #856404;
            font-size: 15px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .sync-panel.ok h3 { color: #155724; }

        .sync-panel ul {
            margin: 8px 0 0 20px;
            color: #666;
        }

        .sync-panel .sync-meta {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }

        .loading-screen {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .guest-chip.not-in-db {
            border-style: dashed;
            border-color: #e0a800;
            background: #fffdf5;
        }

        .guest-chip.from-db-only {
            border-color: #b8d4fe;
            background: #f0f7ff;
        }

        #printArea {
            display: none;
        }

        #printArea.maitre-print {
            font-family: Georgia, 'Times New Roman', serif;
        }

        @media print {
            body > *:not(#printArea) {
                display: none !important;
            }

            body {
                background: white !important;
                margin: 0;
                padding: 0;
            }

            #printArea {
                display: block !important;
                color: #111;
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #printArea:not(.maitre-print) {
                font-family: 'Alex Brush', cursive;
            }

            #printArea .print-page {
                page-break-after: always;
                break-after: page;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            #printArea .print-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            #printArea:not(.maitre-print) .print-table-wrap {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 12px;
            }

            #printArea:not(.maitre-print) .print-table {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                width: 88%;
                max-width: 17cm;
            }

            #printArea:not(.maitre-print) .print-col {
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            #printArea:not(.maitre-print) .print-col.left,
            #printArea:not(.maitre-print) .print-col.right {
                text-align: center;
            }

            #printArea:not(.maitre-print) .print-name {
                font-family: 'Alex Brush', cursive;
                font-size: 28pt;
                line-height: 1.45;
                color: #111;
                break-inside: avoid;
            }

            #printArea:not(.maitre-print) .print-side-label {
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 11pt;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: #666;
                margin-bottom: 28px;
                text-align: center;
            }

            #printArea:not(.maitre-print) .print-footer {
                text-align: center;
                font-family: 'Alex Brush', cursive;
                font-size: 22pt;
                letter-spacing: 0.12em;
                color: #333;
                margin-top: auto;
                padding-top: 48px;
            }

            #printArea.maitre-print .maitre-page {
                page-break-after: always;
                break-after: page;
                min-height: 100vh;
                padding: 0;
            }

            #printArea.maitre-print .maitre-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            #printArea.maitre-print .maitre-title {
                font-size: 18pt;
                color: #8b7355;
                margin-bottom: 6px;
            }

            #printArea.maitre-print .maitre-subtitle {
                font-size: 11pt;
                color: #666;
                margin-bottom: 24px;
            }

            #printArea.maitre-print .maitre-table-heading {
                font-size: 14pt;
                color: #5a4a3a;
                border-bottom: 2px solid #8b7355;
                padding-bottom: 6px;
                margin: 20px 0 12px;
            }

            #printArea.maitre-print .maitre-table-heading:first-of-type {
                margin-top: 0;
            }

            #printArea.maitre-print table {
                width: 100%;
                border-collapse: collapse;
                font-size: 10.5pt;
            }

            #printArea.maitre-print th {
                background: #8b7355 !important;
                color: white !important;
                padding: 8px 10px;
                text-align: left;
                font-weight: normal;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #printArea.maitre-print td {
                padding: 7px 10px;
                border-bottom: 1px solid #ddd;
                vertical-align: top;
            }

            #printArea.maitre-print tr:nth-child(even) td {
                background: #f9f6f2;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #printArea.maitre-print .maitre-tag {
                display: inline-block;
                font-size: 9pt;
                font-weight: bold;
                padding: 2px 6px;
                border-radius: 3px;
                margin-right: 4px;
                text-transform: uppercase;
            }

            #printArea.maitre-print .maitre-tag-seggiolone {
                background: #fff3cd;
                color: #856404;
            }

            #printArea.maitre-print .maitre-tag-veg {
                background: #d4edda;
                color: #155724;
            }

            #printArea.maitre-print .maitre-tag-vegan {
                background: #cce5ff;
                color: #004085;
            }

            #printArea.maitre-print .maitre-tag-allergy {
                background: #f8d7da;
                color: #721c24;
            }

            #printArea.maitre-print .maitre-notes {
                font-size: 9.5pt;
                color: #721c24;
                margin-top: 2px;
            }

            #printArea.maitre-print .maitre-empty {
                color: #888;
                font-style: italic;
                font-size: 10pt;
                padding: 8px 0;
            }

            #printArea.maitre-print .maitre-footer {
                margin-top: 32px;
                text-align: center;
                font-size: 9pt;
                color: #888;
                border-top: 1px solid #e6dfd3;
                padding-top: 10px;
            }

            @page {
                size: A4 portrait;
                margin: 1.5cm 1.8cm;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tavoli Imperiali - Cerimonia</h1>
        <p>Alessandro e Simona &mdash; Trascina gli invitati per riorganizzare i posti</p>
        <div class="toolbar">
            <input type="search" id="searchInput" placeholder="Cerca invitato...">
            <button class="btn btn-primary" onclick="saveLayout()">Salva</button>
            <button class="btn btn-secondary" onclick="printSeatingChart()">Stampa</button>
            <button class="btn btn-secondary" onclick="printMaitreSheet()">Stampa Maitre</button>
            <button class="btn btn-secondary" onclick="resetLayout()">Ripristina disposizione iniziale</button>
            <button class="btn btn-secondary" onclick="reloadFromDb()">Aggiorna dal database</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat"><strong id="statTotal">0</strong>Totale invitati</div>
        <div class="stat"><strong id="statT1">0</strong>Tavolo 1</div>
        <div class="stat"><strong id="statT2">0</strong>Tavolo 2</div>
        <div class="stat"><strong id="statPool">0</strong>Non assegnati</div>
        <div class="stat"><strong id="statSeggiolone">0</strong>Seggioloni</div>
    </div>

    <main id="mainArea"></main>

    <div class="toast" id="toast"></div>
    <div id="printArea"></div>

    <script>
        const STORAGE_KEY = 'tavoli-cerimonia-layout-v3';

        let GUESTS = [];
        let guestMap = {};
        let DEFAULT_LAYOUT = { t1a: [], t1b: [], t2a: [], t2b: [], pool: [] };
        let syncInfo = null;
        let dbOnlyIds = new Set();
        let layout = { t1a: [], t1b: [], t2a: [], t2b: [], pool: [] };
        let draggedId = null;
        let dragSourceZone = null;

        async function init() {
            document.getElementById('mainArea').innerHTML = '<div class="loading-screen">Caricamento invitati dal database...</div>';
            try {
                const res = await fetch('/api/tavoli-invitati');
                if (!res.ok) throw new Error('API error');
                const data = await res.json();
                GUESTS = data.persons;
                guestMap = Object.fromEntries(GUESTS.map(g => [g.id, g]));
                DEFAULT_LAYOUT = data.defaultLayout;
                syncInfo = data.sync;
                dbOnlyIds = new Set((data.sync.dbOnly || []).map(p => p.personId));
                layout = loadLayout();
                render();
            } catch (e) {
                document.getElementById('mainArea').innerHTML =
                    '<div class="loading-screen">Impossibile caricare dal database.<br><br>Apri la pagina dal sito deployato oppure avvia <code>vercel dev</code>.</div>';
            }
        }

        function reloadFromDb() {
            if (!confirm('Aggiornare i nomi dal database? La disposizione attuale verra mantenuta dove possibile.')) return;
            init().then(() => showToast('Dati aggiornati dal database'));
        }

        function loadLayout() {
            try {
                let saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) {
                    const v2 = localStorage.getItem('tavoli-cerimonia-layout-v2');
                    if (v2) {
                        const old = JSON.parse(v2);
                        saved = JSON.stringify({
                            t1a: old.t1a || [],
                            t1b: old.t2a || [],
                            t2a: old.t1b || [],
                            t2b: old.t2b || [],
                            pool: old.pool || []
                        });
                    }
                }
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const allIds = new Set(GUESTS.map(g => g.id));
                    const zones = ['t1a', 't1b', 't2a', 't2b', 'pool'];
                    const seen = new Set();
                    const result = { t1a: [], t1b: [], t2a: [], t2b: [], pool: [] };
                    zones.forEach(z => {
                        (parsed[z] || []).forEach(id => {
                            if (allIds.has(id) && !seen.has(id)) {
                                result[z].push(id);
                                seen.add(id);
                            }
                        });
                    });
                    GUESTS.forEach(g => {
                        if (!seen.has(g.id)) result.pool.push(g.id);
                    });
                    return result;
                }
            } catch (e) { /* ignore */ }
            return JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
        }

        function saveLayout() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(layout));
            showToast('Disposizione salvata');
        }

        function resetLayout() {
            if (!confirm('Ripristinare la disposizione iniziale dalle foto?')) return;
            layout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
            localStorage.removeItem(STORAGE_KEY);
            render();
            showToast('Disposizione ripristinata');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2000);
        }

        const TAG_LABELS = {
            seggiolone: 'Seggiolone',
            gruppo: 'Gruppo'
        };

        function renderGuestChip(id, index) {
            const g = guestMap[id];
            if (!g) return '';
            const tags = (g.tags || []).map(t =>
                `<span class="tag tag-${t}">${TAG_LABELS[t] || t}</span>`
            ).join('');
            const extraClass = !g.inDatabase ? ' not-in-db' : (dbOnlyIds.has(g.id) ? ' from-db-only' : '');
            return `<div class="guest-chip${extraClass}" draggable="true" data-id="${g.id}" data-name="${g.name.toLowerCase()}">
                <span class="num">${index != null ? index + 1 : ''}</span>
                <span class="name">${escapeHtml(g.name)}</span>
                <span class="tags">${tags}</span>
            </div>`;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function countInTable(tKey) {
            return layout[tKey + 'a'].length + layout[tKey + 'b'].length;
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = GUESTS.length;
            document.getElementById('statT1').textContent = countInTable('t1');
            document.getElementById('statT2').textContent = countInTable('t2');
            document.getElementById('statPool').textContent = layout.pool.length;
            const seggioloni = GUESTS.filter(g => g.tags && g.tags.includes('seggiolone')).length;
            document.getElementById('statSeggiolone').textContent = seggioloni;
        }

        function renderSyncPanel() {
            if (!syncInfo) return '';
            const photoOnly = syncInfo.photoOnly || [];
            const dbOnly = syncInfo.dbOnly || [];
            const ok = photoOnly.length === 0 && dbOnly.length === 0;
            let html = `<div class="sync-panel${ok ? ' ok' : ''}"><h3>${ok ? 'Nomi allineati con il database' : 'Differenze rispetto al database'}</h3>`;
            if (photoOnly.length) {
                html += `<p><strong>Solo nelle foto</strong> (non presenti nel DB, mostrati con bordo tratteggiato):</p><ul>${photoOnly.map(p => `<li>${escapeHtml(p.name)}</li>`).join('')}</ul>`;
            }
            if (dbOnly.length) {
                html += `<p><strong>Solo nel database</strong> (extra, disponibili nel pool):</p><ul>${dbOnly.map(p => `<li>${escapeHtml(p.name)}</li>`).join('')}</ul>`;
            }
            if (syncInfo.lastSync) {
                html += `<p class="sync-meta">Ultimo allineamento: ${new Date(syncInfo.lastSync).toLocaleString('it-IT')} &mdash; ${syncInfo.matchedFromPhotos} nomi dalle foto collegati al DB</p>`;
            }
            html += '</div>';
            return html;
        }

        function renderSide(zone, ids) {
            if (ids.length === 0) {
                return '<div class="empty-side">Nessun invitato</div>';
            }
            return ids.map((id, i) => renderGuestChip(id, i)).join('');
        }

        function renderTable(num, tKey) {
            const total = countInTable(tKey);
            return `
                <div class="imperial-table" data-table="${tKey}">
                    <div class="table-panel-header">
                        <h2>Tavolo ${num}</h2>
                        <span class="table-count">${total} posti</span>
                    </div>
                    <div class="table-layout">
                        <div class="seat-column left">
                            <div class="seat-list" data-zone="${tKey}a">${renderSide(tKey + 'a', layout[tKey + 'a'])}</div>
                        </div>
                        <div class="table-spine">
                            <div class="table-surface"></div>
                        </div>
                        <div class="seat-column right">
                            <div class="seat-list" data-zone="${tKey}b">${renderSide(tKey + 'b', layout[tKey + 'b'])}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            const main = document.getElementById('mainArea');
            main.innerHTML = `
                ${renderSyncPanel()}
                <div class="tables-stage">
                    ${renderTable(1, 't1')}
                    ${renderTable(2, 't2')}
                </div>
                <div class="pool-section">
                    <h3>Invitati non assegnati (${layout.pool.length})</h3>
                    <div class="pool-list seat-list" data-zone="pool">
                        ${layout.pool.map(id => renderGuestChip(id)).join('')}
                    </div>
                </div>
            `;
            updateStats();
            bindDragEvents();
            applySearch();
        }

        function bindDragEvents() {
            document.querySelectorAll('.guest-chip').forEach(chip => {
                chip.addEventListener('dragstart', onDragStart);
                chip.addEventListener('dragend', onDragEnd);
            });
            document.querySelectorAll('.seat-list').forEach(list => {
                list.addEventListener('dragover', onDragOver);
                list.addEventListener('dragleave', onDragLeave);
                list.addEventListener('drop', onDrop);
            });
        }

        function onDragStart(e) {
            draggedId = e.currentTarget.dataset.id;
            dragSourceZone = e.currentTarget.closest('.seat-list').dataset.zone;
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedId);
        }

        function onDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        }

        function onDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const list = e.currentTarget;
            list.classList.add('drag-over');

            const afterElement = getDragAfterElement(list, e.clientY);
            const dragging = document.querySelector('.dragging');
            if (!dragging) return;

            if (afterElement == null) {
                list.appendChild(dragging);
            } else {
                list.insertBefore(dragging, afterElement);
            }
        }

        function onDragLeave(e) {
            if (!e.currentTarget.contains(e.relatedTarget)) {
                e.currentTarget.classList.remove('drag-over');
            }
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.guest-chip:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset, element: child };
                }
                return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function onDrop(e) {
            e.preventDefault();
            const targetZone = e.currentTarget.dataset.zone;
            e.currentTarget.classList.remove('drag-over');

            const chips = [...e.currentTarget.querySelectorAll('.guest-chip')];
            const newOrder = chips.map(c => c.dataset.id);

            if (dragSourceZone && dragSourceZone !== targetZone) {
                layout[dragSourceZone] = layout[dragSourceZone].filter(id => id !== draggedId);
            }

            layout[targetZone] = newOrder;
            render();
            saveLayout();
        }

        function applySearch() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            document.querySelectorAll('.guest-chip').forEach(chip => {
                const name = chip.dataset.name;
                chip.classList.toggle('hidden-by-search', term && !name.includes(term));
            });
        }

        document.getElementById('searchInput').addEventListener('input', applySearch);

        function formatPrintName(fullName) {
            const parts = fullName.trim().split(/\s+/);
            if (parts.length <= 1) return fullName;
            const firstName = parts.slice(0, -1).join(' ');
            const initial = parts[parts.length - 1].charAt(0).toUpperCase();
            return `${firstName} ${initial}.`;
        }

        function printNameList(ids) {
            return ids.map(id => {
                const g = guestMap[id];
                if (!g) return '';
                return `<div class="print-name">${escapeHtml(formatPrintName(g.name))}</div>`;
            }).join('');
        }

        function renderPrintSidePage(tableNum, sideLabel, tKey, side, showFooter) {
            return `
                <div class="print-page">
                    <div class="print-table-wrap">
                        <div class="print-table">
                            <p class="print-side-label">Tavolo ${tableNum} &mdash; ${sideLabel}</p>
                            <div class="print-col ${side}">${printNameList(layout[tKey + side])}</div>
                        </div>
                    </div>
                    ${showFooter ? '<p class="print-footer">Trova il tuo posto</p>' : ''}
                </div>
            `;
        }

        function renderPrintTable(tableNum, tKey) {
            return renderPrintSidePage(tableNum, 'Lato sinistro', tKey, 'a', false)
                + renderPrintSidePage(tableNum, 'Lato destro', tKey, 'b', true);
        }

        function getMaitreAnnotations(g) {
            const tags = [];
            if (g.tags && g.tags.includes('seggiolone')) {
                tags.push('<span class="maitre-tag maitre-tag-seggiolone">Seggiolone</span>');
            }
            const diet = g.dietaryPreference || 'nessuna';
            if (diet === 'vegetariano') {
                tags.push('<span class="maitre-tag maitre-tag-veg">Vegetariano</span>');
            } else if (diet === 'vegano') {
                tags.push('<span class="maitre-tag maitre-tag-vegan">Vegano</span>');
            } else if (diet === 'allergie') {
                tags.push('<span class="maitre-tag maitre-tag-allergy">Allergie</span>');
            }
            let notes = '';
            if (g.dietaryNotes) {
                notes = `<div class="maitre-notes">${escapeHtml(g.dietaryNotes)}</div>`;
            }
            return { tags: tags.join(''), notes, hasSpecial: tags.length > 0 || notes };
        }

        function renderMaitreTableRows(tableNum, tKey) {
            const sides = [
                { key: 'a', label: 'Sinistra' },
                { key: 'b', label: 'Destra' }
            ];
            let rows = '';
            sides.forEach(({ key, label }) => {
                layout[tKey + key].forEach(id => {
                    const g = guestMap[id];
                    if (!g) return;
                    const ann = getMaitreAnnotations(g);
                    rows += `<tr>
                        <td>${escapeHtml(g.name)}</td>
                        <td>T${tableNum} ${label}</td>
                        <td>${ann.tags || '—'}${ann.notes}</td>
                    </tr>`;
                });
            });
            return rows;
        }

        function renderMaitreSpecialSection(filterFn) {
            const items = [];
            ['t1a', 't1b', 't2a', 't2b'].forEach(zone => {
                const tableNum = zone.startsWith('t1') ? 1 : 2;
                const side = zone.endsWith('a') ? 'Sinistra' : 'Destra';
                layout[zone].forEach(id => {
                    const g = guestMap[id];
                    if (!g || !filterFn(g)) return;
                    const ann = getMaitreAnnotations(g);
                    items.push(`<tr>
                        <td>${escapeHtml(g.name)}</td>
                        <td>T${tableNum} ${side}</td>
                        <td>${ann.tags}${ann.notes}</td>
                    </tr>`);
                });
            });
            if (!items.length) {
                return `<p class="maitre-empty">Nessuno</p>`;
            }
            return `<table>
                <thead><tr><th>Nome</th><th>Posto</th><th>Note</th></tr></thead>
                <tbody>${items.join('')}</tbody>
            </table>`;
        }

        function renderMaitrePrint() {
            const printDate = new Date().toLocaleString('it-IT');
            const seggioloni = renderMaitreSpecialSection(g =>
                g.tags && g.tags.includes('seggiolone'));
            const dietSpecial = renderMaitreSpecialSection(g =>
                (g.dietaryPreference && g.dietaryPreference !== 'nessuna') || g.dietaryNotes);

            return `
                <div class="maitre-page">
                    <h1 class="maitre-title">Foglio Maitre &mdash; Tavoli Cerimonia</h1>
                    <p class="maitre-subtitle">Alessandro e Simona</p>

                    <h2 class="maitre-table-heading">Seggioloni</h2>
                    ${seggioloni}

                    <h2 class="maitre-table-heading">Intolleranze, allergie e diete speciali</h2>
                    ${dietSpecial}
                </div>
                <div class="maitre-page">
                    <h1 class="maitre-title">Disposizione completa per tavolo</h1>
                    <p class="maitre-subtitle">Riferimento rapido posti e indicazioni</p>

                    <h2 class="maitre-table-heading">Tavolo 1</h2>
                    <table>
                        <thead><tr><th>Nome</th><th>Posto</th><th>Indicazioni</th></tr></thead>
                        <tbody>${renderMaitreTableRows(1, 't1')}</tbody>
                    </table>

                    <h2 class="maitre-table-heading">Tavolo 2</h2>
                    <table>
                        <thead><tr><th>Nome</th><th>Posto</th><th>Indicazioni</th></tr></thead>
                        <tbody>${renderMaitreTableRows(2, 't2')}</tbody>
                    </table>

                    <p class="maitre-footer">Stampato il ${printDate}</p>
                </div>
            `;
        }

        function printSeatingChart() {
            const printArea = document.getElementById('printArea');
            printArea.classList.remove('maitre-print');
            document.fonts.ready.then(() => {
                printArea.innerHTML =
                    renderPrintTable(1, 't1') + renderPrintTable(2, 't2');
                setTimeout(() => window.print(), 100);
            });
        }

        function printMaitreSheet() {
            const printArea = document.getElementById('printArea');
            printArea.classList.add('maitre-print');
            printArea.innerHTML = renderMaitrePrint();
            setTimeout(() => window.print(), 100);
        }

        init();
    </script>
</body>
</html>
